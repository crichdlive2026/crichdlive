<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricHDLive - लाइव क्रिकेट मैच</title>
    
    <!-- ✅ सही Video.js CSS लिंक -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #0b0f19;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #111827;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 30px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .player-wrapper {
            background-color: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #1f2937;
        }

        .status-bar {
            background-color: #1f2937;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        footer {
            background-color: #111827;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #1f2937;
        }

        .video-js {
            font-size: 14px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>CricHDLive</h1>
    </header>

    <div class="container">
        <div class="player-wrapper">
            <div class="status-bar">
                <div class="live-dot"></div>
                <span id="stream-status">स्ट्रीमिंग लोड हो रही है...</span>
            </div>
            
            <video id="cric-live-player" 
                   class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9" 
                   controls 
                   preload="auto">
                <p class="vjs-no-js">इस लाइव मैच को देखने के लिए कृपया जावास्क्रिप्ट चालू करें।</p>
            </video>
        </div>
    </div>

    <footer>
        &copy; 2026 CricHDLive.in | सर्वाधिकार सुरक्षित।
    </footer>

    <!-- ✅ सही Video.js JavaScript लिंक -->
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // आपकी API का लिंक
            const apiEndpoint = "https://live-match-api-nine.vercel.app/api/index"; 

            // Video.js प्लेयर को इनिशियलाइज़ करना
            const player = videojs('cric-live-player');

            // API से डेटा खींचना
            fetch(apiEndpoint)
                .then(response => response.json())
                .then(result => {
                    if(result.success && result.data) {
                        // प्लेयर में लाइव M3U8 लिंक सेट करना
                        player.src({
                            src: result.data,
                            type: 'application/x-mpegURL'
                        });
                        
                        document.getElementById("stream-status").innerText = "लाइव स्ट्रीमिंग चालू है...";
                        
                        // ऑटोमैटिक प्ले करने की कोशिश (ब्राउज़र पॉलिसी के अनुसार)
                        player.ready(function() {
                            var promise = player.play();
                            if (promise !== undefined) {
                                promise.catch(function(error) {
                                    // ऑटो-प्ले ब्लॉक होने पर म्यूट करके प्ले करें
                                    player.muted(true);
                                    player.play();
                                });
                            }
                        });

                    } else {
                        document.getElementById("stream-status").innerText = "स्ट्रीम लिंक नहीं मिल पाया।";
                    }
                })
                .catch(error => {
                    console.error("Error fetching stream:", error);
                    document.getElementById("stream-status").innerText = "सर्वर से कनेक्ट करने में एरर।";
                });
        });
    </script>

</body>
</html>
