<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live: IND vs NZ | CricHDLive VIP</title>

    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --primary: #00ff88; /* Neon Green */
            --secondary: #0077ff; /* Blue */
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- Custom Watermark (Aapka Logo) --- */
        .my-watermark {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid var(--primary);
            pointer-events: none; /* Click paar ho jayega */
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        /* --- Player Wrapper (Masking) --- */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            overflow: hidden; /* Bahar nikla hua hissa kaat dega */
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.1);
            border-bottom: 2px solid var(--primary);
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Ratio */
            height: 0;
            background: #000;
        }

        /* --- THE MAGIC TRICK (Zoom & Crop) --- */
        .video-box iframe {
            position: absolute;
            top: -6%;      /* Thoda upar khiskao */
            left: -6%;     /* Thoda left khiskao */
            width: 112%;   /* Size bada karo (Zoom) */
            height: 112%;  /* Size bada karo */
            border: none;
        }
        /* Mobile ke liye thoda kam zoom taaki score na kate */
        @media (max-width: 768px) {
            .video-box iframe {
                width: 110%;
                height: 110%;
                top: -5%;
                left: -5%;
            }
        }

        /* --- Header UI --- */
        header {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222;
        }
        .brand { font-family: 'Teko', sans-serif; font-size: 28px; color: #fff; }
        .brand span { color: var(--primary); }

        .live-btn {
            background: #ff0044;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px #ff0044;
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }
        
        .btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 25px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

        /* --- Chat Section --- */
        .chat-section {
            max-width: 1100px;
            margin: 20px auto;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            display: none; /* Initially Hidden */
        }
        .chat-frame { width: 100%; height: 500px; border: none; }

        .info-text { text-align: center; color: #666; font-size: 12px; margin-top: 10px; }

    </style>
</head>
<body>

    <header>
        <div class="brand">CRIC<span>HD</span>LIVE</div>
        <div class="live-btn">● LIVE</div>
    </header>

    <div class="player-container">
        
        <div class="my-watermark">CricHDLive VIP</div>

        <div class="video-box">
            <iframe 
                src="https://player.kick.com/crichdlive" 
                allowfullscreen="true"
                scrolling="no">
            </iframe>
        </div>
    </div>

    <p class="info-text">Note: Tap 'Unmute' to enable sound. Zoomed for Ad-Free Experience.</p>

    <div class="controls">
        <button class="btn" onclick="location.reload()">🔄 Refresh</button>
        <button class="btn" onclick="toggleChat()">💬 Live Chat</button>
        <button class="btn" onclick="share()">📤 Share</button>
    </div>

    <div id="chat-box" class="chat-section">
        <iframe class="chat-frame" src="https://kick.com/crichdlive/chat"></iframe>
    </div>

    <script>
        function toggleChat() {
            var chat = document.getElementById("chat-box");
            if (chat.style.display === "block") {
                chat.style.display = "none";
            } else {
                chat.style.display = "block";
                // Scroll to chat
                chat.scrollIntoView({behavior: "smooth"});
            }
        }

        function share() {
            if (navigator.share) {
                navigator.share({
                    title: 'Watch Live Cricket',
                    url: window.location.href
                });
            } else {
                alert("Link Copied!");
            }
        }
    </script>

</body>
</html>
