<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricHD Live Streaming</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        :root { --bg-dark: #050505; --primary: #00e5ff; }
        body { background-color: var(--bg-dark); color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Player Design */
        .player-wrapper { width: 100%; max-width: 900px; position: relative; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); }
        .aspect-ratio { position: relative; padding-bottom: 56.25%; height: 0; }
        .player-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .play-btn { font-size: 50px; color: var(--primary); border: 2px solid var(--primary); border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .player-cover:hover .play-btn { background-color: var(--primary); color: #000; transform: scale(1.1); }

        /* WhatsApp Button Design */
        .wa-join-btn {
            background-color: #25D366; color: #000; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 50px;
            text-decoration: none; display: inline-block;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: 0.3s;
        }
        .wa-join-btn:hover { background-color: #1ebd5a; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- WhatsApp Button -->
    <a href="https://whatsapp.com/channel/0029VbCjOyZLI8YafhIOAo0d" target="_blank" class="wa-join-btn" style="margin-bottom: 20px;">
        📢 Join WhatsApp Channel for Links
    </a>

    <!-- Player -->
    <div class="player-wrapper">
        <div id="player-cover" class="player-cover" onclick="startStream()">
            <div class="play-btn">▶</div>
            <p style="margin-top: 15px; font-size: 20px; font-weight: bold;">Click to Watch Live</p>
        </div>
        <div class="aspect-ratio">
            <div id="video-player" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        </div>
    </div>

    <script>
        function startStream() {
            document.getElementById('player-cover').style.display = 'none';
            document.getElementById('video-player').innerHTML = "";

            // आपका Cloudflare Worker
            var workerUrl = "https://my-cors-proxy.nareshnangad.workers.dev/?url=";
            
            // आपका SonyLIV Ten 3 HD का असली m3u8 लिंक
            var liveM3u8 = "https://dishmt.slivcdn.com/hls/live/2020591/TEN3HD/hdntl=exp=1784529012~acl=%2f*~id=1fee2002-e826-4dff-a118-acac0deb270a~data=hdntl~hmac=25fcc4cbee06600f79c868d9220d5b9cc9557d83c7281408547f7c5dfaff676b/master_3500.m3u8";

            // मुख्य बदलाव: encodeURIComponent का उपयोग ताकि %2f और ~ जैसे स्पेशल सुरक्षा टोकन कभी खराब न हों
            var finalStreamUrl = workerUrl + encodeURIComponent(liveM3u8);

            new Clappr.Player({
                source: finalStreamUrl, 
                parentId: "#video-player",
                width: '100%', 
                height: '100%', 
                autoPlay: true,
                mimeType: "application/x-mpegURL",
                playback: {
                    hlsjsConfig: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        manifestLoadingTimeOut: 15000,
                        manifestLoadingMaxRetry: 3
                    }
                }
            });
        }
    </script>
</body>
</html>
