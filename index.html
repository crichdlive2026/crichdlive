<script>
        var API_URL = "https://live-match-api-nine.vercel.app/api"; 
        var currentLink = "";

        // पॉपअप हमेशा दिखेगा (क्योंकि हमने localStorage हटा दिया है)
        window.onload = function() {
            document.getElementById('wa-popup').style.display = 'flex';
            fetchLink();
        };

        // Join बटन दबाते ही पॉपअप बंद हो जाएगा
        function closePopup() {
            document.getElementById('wa-popup').style.display = 'none';
        }

        // API से लिंक लाना
        function fetchLink() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => { currentLink = data.live_link; })
                .catch(err => console.error("Error:", err));
        }

        // प्लेयर स्टार्ट करना
        function startStream() {
            if (currentLink === "") { alert("लिंक लोड हो रहा है, थोड़ा इंतज़ार करें..."); return; }
            document.getElementById('player-cover').style.display = 'none';
            var player = new Clappr.Player({
                source: currentLink, 
                parentId: "#video-player",
                width: '100%', height: '100%', autoPlay: true,
                mimeType: "application/x-mpegURL"
            });
        }
    </script>
