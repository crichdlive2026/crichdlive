<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricHD Live Streaming | Watch Live Cricket</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <style>
        :root { --bg-dark: #050505; --primary: #00e5ff; }
        body { background-color: var(--bg-dark); color: #fff; font-family: sans-serif; margin: 0; }
        
        .player-wrapper {
            width: 100%; max-width: 900px; margin: 20px auto;
            position: relative; background: #000; border-radius: 8px; overflow: hidden;
        }
        
        .aspect-ratio { position: relative; padding-bottom: 56.25%; height: 0; }
        
        .player-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 20; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
        }
        
        .play-btn { 
            font-size: 50px; color: var(--primary); border: 2px solid var(--primary); 
            border-radius: 50%; width: 80px; height: 80px; display: flex; 
            align-items: center; justify-content: center; 
            transition: 0.3s;
        }
        
        .player-cover:hover .play-btn { background-color: var(--primary); color: #000; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div id="player-cover" class="player-cover" onclick="playStream()">
            <div class="play-btn">▶</div>
            <p>Click to Watch Live</p>
        </div>

        <div class="aspect-ratio">
            <div id="video-player" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        </div>
    </div>

    <script>
        function playStream() {
            var cover = document.getElementById('player-cover');
            cover.style.display = 'none';

            var player = new Clappr.Player({
                source: "https://crickcast-fam.pages.dev/api/proxy?u=https%3A%2F%2Fin-mc-fblive.fancode.com%2Fmumbai%2F143399_english_hls_b76266f66a18138_1ta-di_h264%2F720p.m3u8", 
                parentId: "#video-player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                mimeType: "application/x-mpegURL" // यह लाइन Clappr को बताती है कि यह m3u8 फॉर्मेट है
            });
        }
    </script>
</body>
</html>
