<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricHDLive - लाइव क्रिकेट मैच</title>
    
    <!-- Video.js CSS (खूबसूरत प्लेयर डिज़ाइन के लिए) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        /* पूरी वेबसाइट का बैकग्राउंड और लेआउट */
        body {
            background-color: #0b0f19;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* हेडर (ऊपरी हिस्सा) */
        header {
            background-color: #111827;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* मुख्य कंटेनर */
        .container {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 30px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* वीडियो प्लेयर का आउटर बॉक्स */
        .player-wrapper {
            background-color: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #1f2937;
        }

        /* स्टेटस बार (मैच लाइव का इंडिकेटर) */
        .status-bar {
            background-color: #1f2937;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* फ़ुटर */
        footer {
            background-color: #111827;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #1f2937;
        }

        /* मोबाइल के लिए प्लेयर को सेट करना */
        .video-js {
            font-size: 14px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- वेबसाइट का नाम -->
    <header>
        <h1>CricHDLive</h1>
    </header>

    <div class="container">
        <div class="player-wrapper">
            <!-- लाइव स्टेटस -->
            <div class="status-bar">
                <div class="live-dot"></div>
                <span>लाइव स्ट्रीमिंग चालू है...</span>
            </div>
            
            <!-- मुख्य वीडियो प्लेयर (यह ब्राउज़र में .m3u8 को चलाएगा) -->
            <video id="cric-live-player" 
                   class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9" 
                   controls 
                   preload="auto" 
                   data-setup='{}'>
                   
                <!-- आपका लाइव और सुरक्षित M3U8 लिंक -->
                <source src="https://crichdlive.in" type="application/x-mpegURL">
                
                <p class="vjs-no-js">
                    इस लाइव मैच को देखने के लिए कृपया अपने ब्राउज़र में JavaScript चालू करें।
                </p>
            </video>
        </div>
    </div>

    <!-- कॉपीराइट फ़ुटर -->
    <footer>
        &copy; 2026 CricHDLive.in | सर्वाधिकार सुरक्षित।
    </footer>

    <!-- Video.js JavaScript फ़ाइल (HLS सपोर्ट के लिए ज़रूरी है) -->
    <script src="https://zencdn.net"></script>

</body>
</html>
