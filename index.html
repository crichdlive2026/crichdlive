<script>
    function startStream() {
        document.getElementById('player-cover').style.display = 'none';
        document.getElementById('video-player').innerHTML = "";

        // सुधरा हुआ और सही Akamai M3U8 लिंक (डबल स्लैश हटा दिया गया है)
        var directLiveM3u8 = "https://bpl24middleeast.akamaized.net/hls/live/2109311/j15klM/level_0.m3u8";

        new Clappr.Player({
            source: directLiveM3u8, 
            parentId: "#video-player",
            width: '100%', 
            height: '100%', 
            autoPlay: true,
            mimeType: "application/x-mpegURL",
            playback: {
                hlsjsConfig: {
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 30,
                    manifestLoadingTimeOut: 15000,
                    manifestLoadingMaxRetry: 3
                }
            }
        });
    }
</script>
