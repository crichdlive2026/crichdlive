<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZFSKSMR7G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XZFSKSMR7G');
    </script>
    
    <style>
        /* --- NEON THEME STYLES --- */
        :root {
            --bg-dark: #050505;
            --primary: #00e5ff; /* Neon Blue */
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }
        
        /* Header */
        header {
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .brand { font-size: 24px; font-weight: bold; color: var(--primary); }
        
        /* Player Container */
        .player-wrapper {
            width: 100%;
            max-width: 1000px; /* Desktop par zyada bada na ho */
            margin: 0 auto;
            position: relative;
            background: #000;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15); /* Halki si blue glow */
        }
        
        /* Responsive 16:9 Aspect Ratio */
        .aspect-ratio {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio maintain karega */
            height: 0;
            overflow: hidden;
        }
        
        /* Castr Iframe Setup */
        .aspect-ratio iframe {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            border: none;
        }

        /* Buttons & Content */
        .action-bar { padding: 15px; display: flex; gap: 10px; justify-content: center; background: #111; }
        .btn { background: #333; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--primary); color: #000; }
        
        .content-area { padding: 20px; max-width: 1000px; margin: auto; text-align: center; }
        .status-dot { color: red; animation: blink 2s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">CricHDLive</div>
        <div style="font-weight: bold;"><span class="status-dot">●</span> LIVE</div>
    </header>

    <div class="player-wrapper">
        <div class="aspect-ratio">
            <iframe 
                src="https://player.castr.com/d_1b58caf0f48f11f0a4b6d932fe52cbd6" 
                frameborder="0" 
                scrolling="no" 
                allow="autoplay; fullscreen"
                allowfullscreen 
                webkitallowfullscreen 
                mozallowfullscreen>
            </iframe>
            </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-primary" onclick="location.reload()">🔄 Refresh Stream</button>
        <button class="btn" onclick="shareLink()">📤 Share</button>
    </div>

    <div class="content-area">
        <h3>🏏 Match Status: Connected</h3>
        <p style="color: #aaa; font-size: 14px;">Powered by Castr High-Speed Streaming</p>
    </div>

    <script>
        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Live Cricket Streaming',
                    url: window.location.href
                });
            } else {
                alert('Link copied to clipboard!');
            }
        }
    </script>

</body>
</html>
