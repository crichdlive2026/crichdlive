<!DOCTYPE html>
<html lang="hi-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 LIVE: IND vs SL Test Match Live Streaming - Watch India vs Sri Lanka Free | CricHD Live</title>
    <meta name="description" content="Watch India vs Sri Lanka Test series live streaming in HD on crichdlive.in. Enjoy buffering-free IND vs SL live match online.">
    <link rel="canonical" href="https://crichdlive.in/" />
    
    <!-- HLS Library for Fast Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { --bg-dark: #080808; --primary: #00e5ff; --accent: #25D366; }
        body { background-color: var(--bg-dark); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        /* Professional Player Container Design */
        .player-wrapper { 
            width: 100%; 
            max-width: 900px; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 30px rgba(0, 229, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .aspect-ratio { position: relative; padding-bottom: 56.25%; height: 0; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Loading Spinner (Professional Touch) */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* WhatsApp Button */
        .wa-join-btn { 
            background-color: var(--accent); 
            color: #000; 
            padding: 12px 30px; 
            font-size: 16px;
            font-weight: bold; 
            border-radius: 50px; 
            text-decoration: none; 
            margin-bottom: 15px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .wa-join-btn:hover { transform: scale(1.03); }

        /* Content Box */
        .content-box { max-width: 900px; width: 100%; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 15px; box-sizing: border-box; }
        .content-box h1 { color: var(--primary); font-size: 20px; margin-top: 0; }
        .content-box p { color: #aaa; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- WhatsApp Button -->
    <a href="https://whatsapp.com/channel/0029VbCjOyZLI8YafhIOAo0d" target="_blank" class="wa-join-btn">📢 Join WhatsApp Channel for HD Links</a>

    <!-- Smart Stream Player Wrapper -->
    <div class="player-wrapper">
        <div id="loader"></div>
        <div class="aspect-ratio" id="playerContainer">
            <video id="video" controls autoplay playsinline style="display:none;"></video>
        </div>
    </div>

    <!-- Live Score Box -->
    <div class="content-box">
        <h3 style="color: var(--primary); margin: 0 0 10px 0;">🏏 IND vs SL - Live Score</h3>
        <div style="background: #fff; border-radius: 6px; overflow: hidden; padding: 5px;">
            <script type="text/javascript" src="https://www.cricwaves.com/cricket/widgets/script/scoreWidgets.js"></script>
        </div>
    </div>

    <!-- SEO Content Box -->
    <div class="content-box">
        <h1>IND vs SL Live Streaming: Watch India vs Sri Lanka Test Match Free</h1>
        <p>Welcome to <strong>CricHD Live</strong>. Enjoy lightning-fast, buffer-free live streaming of the India vs Sri Lanka series directly on your mobile and desktop devices in HD quality.</p>
    </div>

    <!-- Ultra-Fast Smart Player Engine -->
    <script>
        const API_URL = 'https://live-match-api-nine.vercel.app/api'; 
        const container = document.getElementById('playerContainer');
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');

        fetch(API_URL)
            .then(res => res.json())
            .then(response => {
                const { type, data } = response;

                if (type === 'iframe') {
                    // अगर API से Iframe कोड आया है
                    loader.style.display = 'none';
                    video.style.display = 'none';
                    container.innerHTML = data;
                } else {
                    // अगर API से .m3u8 लिंक आया है (सुपर-फास्ट HLS इंजन)
                    video.style.display = 'block';
                    
                    if (Hls.isSupported()) {
                        var hlsConfig = {
                            maxBufferLength: 20,
                            maxMaxBufferLength: 40,
                            liveSyncDurationCount: 2,
                            lowLatencyMode: true,
                            xhrSetup: (xhr) => { xhr.withCredentials = false; }
                        };

                        var hls = new Hls(hlsConfig);
                        hls.loadSource(data);
                        hls.attachMedia(video);
                        
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            loader.style.display = 'none';
                            video.play().catch(() => {
                                console.log("Autoplay restricted, user interaction needed.");
                            });
                        });

                        // ऑटो रिकवरी एरर हैंडलिंग
                        hls.on(Hls.Events.ERROR, (event, data) => {
                            if (data.fatal) {
                                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                                else hls.destroy();
                            }
                        });

                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // सफारी (Apple) ब्राउज़र के लिए नेटिव सपोर्ट
                        video.src = data;
                        video.addEventListener('loadedmetadata', () => {
                            loader.style.display = 'none';
                            video.play();
                        });
                    }
                }
            })
            .catch(err => {
                loader.style.display = 'none';
                console.error("Stream loading failed:", err);
            });
    </script>
</body>
</html>
