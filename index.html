<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 LIVE: IND vs SL Test Match Live Streaming - Watch India vs Sri Lanka Free</title>
    <meta name="description" content="Watch India vs Sri Lanka Test series live streaming in HD on crichdlive.in. Enjoy buffering-free IND vs SL live match online.">
    <link rel="canonical" href="https://crichdlive.in/" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg-dark: #050505; --primary: #00e5ff; }
        body { background-color: var(--bg-dark); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .player-wrapper { width: 100%; max-width: 900px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .aspect-ratio { position: relative; padding-bottom: 56.25%; height: 0; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .wa-join-btn { background-color: #25D366; color: #000; padding: 12px 25px; font-weight: bold; border-radius: 50px; text-decoration: none; margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="https://whatsapp.com/channel/0029VbCjOyZLI8YafhIOAo0d" target="_blank" class="wa-join-btn">📢 Join WhatsApp Channel</a>
    <div class="player-wrapper">
        <div class="aspect-ratio">
            <video id="video" controls autoplay playsinline></video>
        </div>
    </div>
    <script>
        // आपकी Vercel API का लिंक जो अब सही काम करेगा
        const API_URL = 'https://live-match-api-nine.vercel.app/api'; 
        var video = document.getElementById('video');

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                var videoSrc = data.live_link;
                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                        video.play().catch(e => console.log("Autoplay blocked, user interaction required.")); 
                    });
                }
            })
            .catch(err => console.error("Error fetching live link:", err));
    </script>
</body>
</html>
